# =============================================================================
# zcbsl-resize - sensitivity study configuration
#
# Each room starts from a baseline defined in src/zcbsl_resize/rooms.py, so only
# what you want to VARY (or override) needs to appear here.
#
# Every entry takes one of four forms:
#
#   name: 1.2                  FIXED    override the baseline with one value
#   name: [min, max, step]      GRID    swept on the factorial grid
#   name: [min, max, null]    BOUNDS    global sensitivity samples it;
#                                       the grid holds it at the midpoint
#   name: {values: [1, 2, 5]}   LIST    explicit values, for non-uniform steps
#
# Envelope parameters are per surface: <surface>_<property>, where surface is
# one of north / east / south / west / roof / floor, and property is one of
# u_opaque / u_glazing / wwr / shgc / irradiance / exposure.
# Width runs east-west, depth runs north-south.
#
# Run `python study/check_config.py` after editing: it validates names and
# ranges against the model and prints the resulting grid size.
#
# Lines marked CONFIRM are assumptions, not your numbers.
# =============================================================================

meta:
  title: Module room and climate chamber sizing envelope
  notes: >
    Ranges of design capacity, airflow, plant size and ramp feasibility across
    the configurations each room can actually take.

# =============================================================================
# SHARED - operation, plant and delivery limits common to both rooms
# =============================================================================
shared:

  # ---- setpoints and ramp -------------------------------------------------
  setpoint_min: [10.0, 20.0, 5.0]           # CONFIRM: what range do experiments need?
  setpoint_max: [24.0, 40.0, 8.0]           # CONFIRM
  ramp_minutes: {values: [10, 15, 20, 30, 45, 60, 90, 120, 180, 240]}
  margin_pct: 15.0

  # ---- thermal mass -------------------------------------------------------
  # Both rooms are lined in aluminium bonded to insulated panels, with glass.
  # Thermally thin, so the whole layer participates: 7 kJ/m2K.
  base_shell_capacity: [5.0, 15.0, 2.5]
  added_mass_area: [0.0, 60.0, 15.0]        # CONFIRM: how much can you install?
  added_mass_thickness: [0.05, 0.50, null]
  added_mass_rho_c: 1800.0                  # rammed earth
  added_mass_k: 1.25

  # ---- ventilation and gains ---------------------------------------------
  ach: [0.5, 12.0, null]                    # CONFIRM
  vent_supply_temp: 21.0                    # CONFIRM: is supply air pre-conditioned?
  vent_supply_rh: 60.0
  target_rh: [30.0, 70.0, null]
  occupants: [0.0, 4.0, 2.0]
  sensible_per_person: 75.0
  latent_per_person: 45.0

  # ---- delivery limits ----------------------------------------------------
  radiant_fraction: 60.0                    # CONFIRM: active share of floor + roof
  radiant_heat_limit: 100.0                 # EN 1264 / ISO 11855
  radiant_cool_limit: 60.0                  # condensation-limited
  supply_dt: [8.0, 20.0, null]
  surface_film_h: 8.0                       # still air; raise if you blow over surfaces
  max_air_surface_dt: [5.0, 30.0, 5.0]      # THE decisive unknown

  # ---- dedicated heat pump -----------------------------------------------
  # One machine per room, drawing on the hot and cold expansion tanks. Those
  # are held at temperature by the 70 kW interface heat pump on the anergy
  # network, so they are an unlimited SOURCE, not a store: nothing absorbs the
  # ramp surge and each room's machine carries its full design capacity.
  tank_temp_hot: 30.0
  tank_temp_cold: 10.0
  exchanger_approach: [1.0, 5.0, 1.0]
  carnot_efficiency: [0.35, 0.60, 0.05]

  # ---- design conditions --------------------------------------------------
  boundary_temp_winter: -8.0                # CONFIRM: Zurich design condition?
  boundary_temp_summer: 32.0                # CONFIRM
  boundary_rh: 60.0
  surrounding_temp: 21.0
  pressure_pa: 96500.0                      # Zurich, ~410 m

# =============================================================================
# ROOMS
# =============================================================================
rooms:

  # ---------------------------------------------------------------------------
  module_room:
    base: module_room        # src/zcbsl_resize/rooms.py
    label: Module room
    notes: >
      3.75 w x 4.50 d x 5.20 h. South wall and roof exterior; north, east, west
      walls and floor face the lab. The envelope is exchangeable, so its
      construction is what this study explores.

    # ---- the exchangeable south facade -------------------------------------
    south_u_opaque: [0.05, 2.50, 0.35]
    south_u_glazing: [0.50, 3.00, 0.50]
    south_wwr: [0.0, 95.0, 19.0]
    south_shgc: [0.0, 1.00, 0.25]
    south_irradiance: [0.0, 1500.0, 375.0]  # south facing, peak 1500 W/m2

    # ---- the roof, also exchangeable ---------------------------------------
    roof_u_opaque: [0.05, 2.50, 0.35]

    # ---- internal gains -----------------------------------------------------
    equipment_w_per_m2: [0.0, 100.0, 25.0]  # CONFIRM: what runs in this room?

  # ---------------------------------------------------------------------------
  climate_chamber:
    base: climate_chamber    # src/zcbsl_resize/rooms.py
    label: Climate chamber
    notes: >
      8.00 w x 4.50 d x 12.00 h. North, east and west walls exterior, each with
      40% clerestory glazing in xenon-filled insulated glass extrusions. South
      wall and floor face interior space. Roof exterior. The envelope is fixed.
      Houses the Artificial Sun: 1200 W/m2 over 8.75 m2 = 10 500 W of light,
      291.7 W/m2 over the 36 m2 floor. LED cooling is extracted separately.

    # Envelope is fixed and comes from rooms.py. Nothing to sweep here.
    # East and west peak irradiance (550 W/m2) is an ASSUMPTION - only the
    # north figure of 400 W/m2 was given. CONFIRM.

    # The Sun on or off is a scenario, not a slider: with 10.5 kW of light the
    # room never needs heating, so the heating design case is Sun-off.
    equipment_w_per_m2: {values: [0.0, 291.7]}

# =============================================================================
# WHAT TO RUN
# =============================================================================
study:

  outputs:
    - heating_design           # air-side coil, W
    - cooling_design
    - plant_heating            # dedicated heat pump, W
    - plant_cooling
    - design_flow_ls
    - latent_design
    - required_air_surface_dt
    - min_feasible_ramp_minutes
    - radiant_flux_cool
    - envelope_conductance
    - cop_heating
    - cop_cooling
    - electric_cooling
    - tank_reject_cooling
    - free_cooling

  # Factorial grids. Keep each to 2-3 axes; check_config.py prints the row count.
  grids:
    feasibility:
      axes: [ramp_minutes, added_mass_area, base_shell_capacity]
    envelope:
      axes: [south_wwr, south_u_opaque, south_irradiance]
    heat_pump:
      axes: [supply_dt, setpoint_min, carnot_efficiency]
    operation:
      axes: [setpoint_min, setpoint_max, equipment_w_per_m2]

  # Global sensitivity: samples the full space rather than gridding it, so
  # interactions and the film threshold are not missed.
  morris:
    trajectories: 200
    levels: 8
    seed: 20260918

  # Envelope of achievable values per room: Latin hypercube over everything not
  # fixed, to report honest min/max ranges.
  envelope_sample:
    n: 20000
    seed: 20260918
